name: Deploy website to Cloudflare

on:
  push:
    branches:
      - main

permissions:
  contents: read

# Keep an active deployment running to completion. Queued pushes are serialized;
# the main-head check below prevents an older run from replacing newer code.
concurrency:
  group: mangatracker-production
  cancel-in-progress: false
  queue: max

defaults:
  run:
    working-directory: manga-share-worker
    shell: bash

env:
  CI: "true"
  WRANGLER_SEND_METRICS: "false"

jobs:
  deploy:
    name: Test and deploy production website
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: manga-share-worker/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate the production deployment
        run: npx --no-install wrangler deploy --dry-run --config wrangler.production.jsonc

      - name: Check that this commit is still main
        id: main-head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$latest_sha" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::A newer main commit exists (${latest_sha}); skipping deployment of ${GITHUB_SHA}."
          fi

      - name: Deploy the existing production Worker
        if: steps.main-head.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::The repository secret CLOUDFLARE_API_TOKEN is missing. Add the restricted deployment token under Settings > Secrets and variables > Actions."
            exit 1
          fi
          npm run deploy

      - name: Verify public production endpoints
        if: steps.main-head.outputs.current == 'true'
        run: node scripts/verify-public.mjs

      - name: Summarize the run
        if: always()
        env:
          RUN_STATUS: ${{ job.status }}
          CURRENT_MAIN: ${{ steps.main-head.outputs.current }}
        run: |
          {
            printf '## Manga Tracker production\n\n'
            printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Result: **%s**\n' "$RUN_STATUS"
            if [[ "$CURRENT_MAIN" == "false" ]]; then
              printf -- '- Deployment skipped because main has a newer commit.\n'
            elif [[ "$RUN_STATUS" == "success" ]]; then
              printf -- '- Existing Worker deployed and public endpoint checks passed.\n'
            else
              printf -- '- Inspect the failed step above. Failed tests or a failed dry-run prevent deployment; a failed public check occurs after deployment.\n'
            fi
            printf -- '- Configuration: `manga-share-worker/wrangler.production.jsonc`\n'
            printf -- '- Worker: `realityforge-manga-share`\n'
          } >> "$GITHUB_STEP_SUMMARY"
